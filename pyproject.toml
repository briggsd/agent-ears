[project]
name = "agent-ears"
version = "0.1.0"
description = "Lets a coding agent hear: acoustic reports, A/B diffs, spectrograms, and a log of human listening verdicts."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "praat-parselmouth>=0.4.5",
    "pyloudnorm>=0.1.1",
    "matplotlib>=3.8",
    "onnxruntime>=1.17",
    "sherpa-onnx>=1.10",
]

[project.scripts]
ears = "agent_ears.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_ears"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
